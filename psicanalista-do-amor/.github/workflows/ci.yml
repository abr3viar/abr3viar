name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: psicanalista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d psicanalista_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/psicanalista_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (+ invariantes de segurança)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Migrations em sincronia com o schema
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "O schema mudou sem migration commitada. Rode npm run db:generate."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Testes (unidade + integração)
        run: npm test
      - name: Build
        run: npm run build
      - name: Auditoria de dependências
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: psicanalista_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d psicanalista_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://app:app@localhost:5432/psicanalista_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
